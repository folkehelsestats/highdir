url: https://github.com/folkehelsestats/highdir

template:
  bootstrap: 5
  bootswatch: lumen
  logo: man/figures/logo.png
  favicon: man/figures/favicon.png

development:
  mode: auto

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Quick start
      href: articles/quick-start.html

articles:
- title: Getting started
  navbar: ~
  contents:
  - quick-start
  - specification

- title: Guides
  navbar: Guides
  contents:
  - examples
  - accessibility

news:
  one_page: true

reference:
- title: Plot basics
  desc: >
    All highdir plots begin with a call to `hd()`, supplying a specification
    via `hd_spec()` or defined directly in `hd()`. You then add geoms and
    options with `+`. To save a plot to disk, use `hd_save()`.
  contents:
  - hd
  - +.hd
  - hd_spec
  - hd_opts
  - hd_save

- title: Layers

- subtitle: Geoms
  desc: >
    Geoms define the visual representation of your data. Each `hd_geom_*()`
    function adds a layer to the plot with a specific chart type.
  contents:
  - starts_with("hd_geom_")

- subtitle: Geom helpers
  desc: >
    Utility functions for working with geoms — listing available types,
    inspecting arguments, and registering custom geoms.
  contents:
  - list_geoms
  - geom_args
  - register_geom

- title: Themes
  desc: >
    Themes control the visual style of figures. Use `hd_theme()` for
    highcharter output, `gg_theme()` for ggplot2 output, and
    `hd_set_theme()` to apply a theme globally across all plots.
  contents:
  - hd_theme
  - gg_theme
  - hd_set_theme

- subtitle: Palettes
  desc: >
    Functions for working with colour palettes used across chart types.
  contents:
  - list_palettes
  - get_palette
  - register_palette

- title: Backends
  desc: >
    highdir is backend-agnostic and can render charts using either ggplot2
    or highcharter. Use these functions to list, register, and switch between
    available backends.
  contents:
  - list_backends
  - register_backend

- title: JavaScript
  desc: >
    JavaScript utilities for extending Highcharts output. Relevant only
    when using the highcharter backend.
  contents:
  - hd_add_js

- title: Applications
  desc: >
    Helpers for building interactive Shiny applications with highdir charts.
  contents:
  - hd_app
  - hd_make

- title: Printing
  desc: >
    Methods for rendering highdir objects in the console and interactive sessions.
  contents:
  - print.hd

- title: Datasets
  desc: >
    Example datasets bundled with highdir, used in documentation examples
    and vignettes to illustrate typical use cases.
  contents:
  - alco1
  - alco2
