url: https://github.com/folkehelsestats/highdir

template:
  bootstrap: 5
  bootwatch: lumen
  logo: man/figures/logo.png
  favicon: man/figures/favicon.png

development:
  mode: auto

pkgdown:
  run_examples: true

navbar:
  structure:
    left: [start, reference, articles, news]
    right: [search, github]
  components:
    start:
      text: Quick start
      href: articles/quick-start.html

articles:
  - title: Start
    navbar:
    contents:
      - quick-start
      - specification

  - title: Guides
    navbar: Guides
    contents:
      - examples
      - accessibility

news:
  text: Updates
  href: news/index.html


reference:
  - title: Primary functions
    desc: >-
      Core functions used to generate figures.
    contents:
      - hd_spec
      - hd_make
  - title: Secondary functions
    desc: >-
      Additional optional functions that support workflows.
    contents:
      - hd_opts
      - hd_save
      - hd_app
  - title: Backends
    desc: >-
      Backend engines used to build figures.
    contents:
      - list_backends
      - register_backend

  - title: Geoms

  - subtitle: Main
    desc: >-
      All highdir plots begin with a call to `hd()`, supply with either `hd_spec()`
      or directly defined in `hd()`. You then add geoms and options with `+`.
      To save a plot to disk, use `hd_save()`.
    contents:
     - hd
     - +.hd
  - subtitle: Types
    desc: >-
      Geom types
    contents:
      - starts_with("hd_geom_")
  - subtitle: Helpers
    desc: >-
      Geometric layers and related functions used to construct figures.
    contents:
      - list_geoms
      - geom_args
      - register_geom
      - print.hd
  - title: Themes
    desc: >-
      Theme functions defining the visual style of figures.
    contents:
      - hd_theme
      - gg_theme
      - hd_set_theme
      - list_palettes
      - get_palette
      - register_palette
  - title: JavaScript
    desc: >-
      JavaScript-related utilities (relevant for Highcharts output).
    contents:
      - hd_add_js
  - title: Datasets
    desc: >-
      Example datasets
    contents:
      - alco1
      - alco2
