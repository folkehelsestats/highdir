home:
  links:
  - text: Helsedirektoratet
    href: https://www.hdir.no

url: https://github.com/folkehelsestats/highdir

template:
  bootstrap: 5
  bootwatch: lumen
  logo: man/figures/logo.png
  favicon: man/figures/favicon.png

development:
  mode: auto

pkgdown:
  run_examples: true

navbar:
  structure:
    left: [start, reference, articles, news]
    right: [search, github]
  components:
    start:
      text: Quick start
      href: articles/quick-start.html

articles:
  - title: Start
    navbar:
    contents:
      - quick-start
      - accessibility

  - title: Declarative
    navbar: Declarative
    contents:
      - specification
      - examples

news:
  text: Updates
  href: news/index.html


reference:
  - title: Declarative API
  - subtitle: Primary functions
    desc: >-
      Core functions used to generate figures.
      See the [examples](https://folkehelsestats.github.io/highdir/articles/examples.html)
      for practical usage.
    contents:
      - hd_spec
      - hd_make
  - subtitle: Secondary functions
    desc: >-
      Additional optional functions that support workflows.
    contents:
      - hd_opts
      - hd_save
      - hd_app

  - title: Layered API

  - subtitle: Primary functions
    desc: >-
      All highdir plots start with a call to `hd()`, either using a specification
      created with `hd_spec()` or defined directly inside `hd()`. You then layer
      geoms and options using `+`. See the examples under each geom below for
      concrete usage patterns.
    contents:
     - hd
  - subtitle: Secondary functions
    desc: >-
      Geom types
    contents:
      - starts_with("hd_geom_")

  - title: Backends
    desc: >-
      Backend engines used to build figures.
    contents:
      - list_backends
      - register_backend

  - title: Themes
    desc: >-
      Theme functions defining the visual style of figures.
    contents:
      - hd_theme
      - gg_theme
      - hd_set_theme
      - list_palettes
      - get_palette
      - register_palette

  - title: Helpers
    desc: >-
      Geometric layers and related functions used to construct figures.
    contents:
      - +.hd
      - list_geoms
      - geom_args
      - register_geom
      - print.hd

  - title: JavaScript
    desc: >-
      JavaScript-related utilities (relevant for Highcharts output).
    contents:
      - hd_add_js

  - title: Datasets
    desc: >-
      Example datasets
    contents:
      - alco1
      - alco2
